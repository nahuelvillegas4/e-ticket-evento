<title>e-TicketEvento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de taquilla a la izquierda (vistas por rol), "cadena en vivo" fija a la derecha
   (reloj simulado, máquinas de estado y feed de transacciones). En móvil se apila. */
:root {
  --bg: #F4F3F8; --surface: #FFFFFF; --surface-2: #ECEBF3; --line: #DAD8E5;
  --fg: #17152A; --muted: #615D78;
  --accent: #DE4F24; --accent-ink: #FFFFFF; --accent-soft: #FBE2D8;
  --chain: #4A44C6; --chain-soft: #E5E4FA;
  --ok: #157F59; --ok-soft: #DCF2E8; --warn: #A86B12; --warn-soft: #FAEED6; --bad: #C2303B; --bad-soft: #F8DEE0;
  --shadow: 0 1px 2px rgba(23,21,42,.06), 0 8px 24px rgba(23,21,42,.07);
  --f-display: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101018; --surface: #191924; --surface-2: #222230; --line: #31314A;
  --fg: #ECEBF5; --muted: #A19EB9;
  --accent: #FF7A4C; --accent-ink: #1C0D06; --accent-soft: #3B2118;
  --chain: #A3A0FF; --chain-soft: #25244A;
  --ok: #43D49D; --ok-soft: #12322A; --warn: #F2B552; --warn-soft: #3A2C12; --bad: #FF6D76; --bad-soft: #3D1A1F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101018; --surface: #191924; --surface-2: #222230; --line: #31314A;
  --fg: #ECEBF5; --muted: #A19EB9;
  --accent: #FF7A4C; --accent-ink: #1C0D06; --accent-soft: #3B2118;
  --chain: #A3A0FF; --chain-soft: #25244A;
  --ok: #43D49D; --ok-soft: #12322A; --warn: #F2B552; --warn-soft: #3A2C12; --bad: #FF6D76; --bad-soft: #3D1A1F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .82em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; position: relative; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); transform: translateY(-50%); }
.brand-mark::before { left: -4px; } .brand-mark::after { right: -4px; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
.brand small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.net { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; background: var(--chain-soft); color: var(--chain); font-size: 12px; font-weight: 600; white-space: nowrap; }
.net::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.wallet-btn { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.wallet-btn:hover { border-color: var(--accent); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; flex: none; }
.wallet-btn .who { text-align: left; line-height: 1.15; }
.wallet-btn .who b { display: block; font-size: 13px; }
.wallet-btn .who span { font-size: 11px; color: var(--muted); }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; max-width: 1480px; margin: 0 auto; }
@media (max-width: 1060px) { .layout { grid-template-columns: minmax(0, 1fr); } }
main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.tab { flex: 1 0 auto; border: 0; background: transparent; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; justify-content: center; }
.tab:hover { color: var(--fg); background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tab .count { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.view-head { display: flex; flex-direction: column; gap: 4px; }
.view-head p { color: var(--muted); max-width: 70ch; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner b { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- Buttons & pills ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.dark { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.block { width: 100%; padding: 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.warn-send { background: var(--bad); border-color: var(--bad); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--ok-soft); color: var(--ok); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-chain { background: var(--chain-soft); color: var(--chain); }
.p-mute { background: var(--surface-2); color: var(--muted); }
.p-accent { background: var(--accent-soft); color: var(--accent); }
.chip { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); }

/* ---------- Forms ---------- */
.org-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .org-grid { grid-template-columns: minmax(0, 1fr); } }
.form { display: flex; flex-direction: column; gap: 16px; }
.fieldset { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 520px) { .fieldset { grid-template-columns: minmax(0, 1fr); } }
.fieldset .full { grid-column: 1 / -1; }
.legend { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.legend::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12.5px; font-weight: 600; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field .err { font-size: 11.5px; color: var(--bad); font-weight: 600; }
.field .err .mono { font-weight: 400; }
.input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.bad { border-color: var(--bad); }
.suffix { position: relative; }
.suffix span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
.suffix .input { padding-right: 46px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.form-foot { display: flex; flex-direction: column; gap: 8px; }

/* ---------- Ticket ---------- */
.ticket { --notch: 11px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 118px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s ease; }
.ticket:hover { transform: translateY(-2px); }
.ticket.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.ticket .main { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ticket .stub { border-left: 2px dashed var(--line); padding: 16px 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; text-align: center; background: var(--surface-2); position: relative; }
.ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; left: calc(var(--notch) * -1 - 1px); width: calc(var(--notch) * 2); height: calc(var(--notch) * 2); border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.ticket .stub::before { top: calc(var(--notch) * -1); } .ticket .stub::after { bottom: calc(var(--notch) * -1); }
.ticket .stub .tid { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1; }
.ticket .stub small { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ticket .ev-name { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; line-height: 1.15; }
.ticket .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12.5px; }
.ticket .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { min-width: 0; }
.kv small { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kv b { font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ticket .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ticket.dim .main { opacity: .7; }
.stamp { position: absolute; top: 14px; right: 132px; transform: rotate(-8deg); border: 2px solid currentColor; border-radius: 6px; padding: 2px 8px; font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; pointer-events: none; }
@media (max-width: 520px) { .ticket { grid-template-columns: minmax(0, 1fr) 88px; } .stamp { right: 100px; } .ticket .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.list { display: flex; flex-direction: column; gap: 12px; }

/* Poster (cartelera) */
.poster { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.poster .art { height: 112px; position: relative; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
.poster .art .date { font-family: var(--f-display); font-weight: 800; line-height: .95; font-size: 2rem; }
.poster .art .date small { display: block; font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.poster .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.poster .body h3 { font-size: 1.12rem; }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.price { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; }
.price small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

/* Tablas */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }

/* Rules list */
.rules { display: flex; flex-direction: column; gap: 0; }
.rule { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.rule:last-child { border-bottom: 0; }
.rule .ic { width: 26px; height: 26px; border-radius: 7px; background: var(--chain-soft); color: var(--chain); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.rule b { font-variant-numeric: tabular-nums; text-align: right; }
.rule small { display: block; color: var(--muted); font-size: 11.5px; }

/* ---------- Chain panel ---------- */
aside.chain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.panel h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.clock { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; margin-top: 6px; }
.clock-sub { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.clock-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sm { width: 100%; height: auto; display: block; margin-top: 8px; }
.sm .node rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
.sm .node text { fill: var(--muted); font-family: var(--f-body); font-size: 11.5px; font-weight: 600; }
.sm .node.seen rect { fill: var(--chain-soft); stroke: var(--chain); }
.sm .node.seen text { fill: var(--chain); }
.sm .node.cur rect { fill: var(--accent); stroke: var(--accent); }
.sm .node.cur text { fill: var(--accent-ink); font-weight: 800; }
.sm .node.cur { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent)); }
.sm .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
.sm .edge.dash { stroke-dasharray: 4 3; }
.sm .elbl { fill: var(--muted); font-family: var(--f-mono); font-size: 8.5px; }
.sm .arrowhead { fill: var(--muted); }
.sm-caption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.hist { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.hist div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
.hist .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.txlog-panel { display: flex; flex-direction: column; }
.txlog { overflow-y: auto; max-height: 560px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding-right: 2px; }
.tx { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--bg); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.tx.new { animation: flash 1.2s ease; }
@keyframes flash { from { background: var(--accent-soft); } to { background: var(--bg); } }
.tx .fn { font-family: var(--f-mono); font-weight: 600; font-size: 12px; overflow-wrap: anywhere; }
.tx .fn em { font-style: normal; color: var(--muted); font-weight: 400; }
.tx .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); }
.tx .evs { display: flex; flex-wrap: wrap; gap: 4px; }
.tx .evs span { font-family: var(--f-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--chain-soft); color: var(--chain); }
.tx .revert { font-family: var(--f-mono); font-size: 11px; color: var(--bad); overflow-wrap: anywhere; }
.tx details summary { cursor: pointer; color: var(--muted); font-size: 11px; }
.tx details pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--f-mono); font-size: 10.5px; color: var(--fg); background: var(--surface-2); padding: 6px; border-radius: 6px; }
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.toggle-row input { accent-color: var(--accent); }

/* ---------- Modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(12, 10, 24, .55); backdrop-filter: blur(3px); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease; }
.overlay.top { z-index: 60; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: pop .18s ease; }
.modal.wide { width: min(680px, 100%); }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
.modal-head { padding: 16px 18px 12px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--line); }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.step { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.step i { height: 4px; border-radius: 999px; background: var(--surface-2); }
.step.done i { background: var(--chain); } .step.cur i { background: var(--accent); } .step.cur { color: var(--fg); }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.box.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
.box.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: var(--bad-soft); }
.box.chain { border-color: color-mix(in srgb, var(--chain) 35%, var(--line)); background: var(--chain-soft); }
.hashline { font-family: var(--f-mono); font-size: 11px; overflow-wrap: anywhere; word-break: break-all; }
.kvrows { display: flex; flex-direction: column; gap: 6px; }
.kvrows div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }

<script>
"use strict";
/* =====================================================================
   e-TicketEvento · Interfaz de demostración
   Simula en el navegador los tres contratos (EventManager, EntradaNFT,
   ReventaMarketplace) replicando sus validaciones y errores custom.
   Las firmas EIP-712, los compromisos keccak256 y las direcciones son
   reales (ethers.js); la red, los pagos y los bloques son ficticios.
   ===================================================================== */
const E = window.ethers;
const U = E.utils;
const CHAIN_ID = 80002;
const ADDR = {
  EntradaNFT: "0x091e9EEb34181D89d5C3F3171D31036B688909cb",
  EventManager: "0x321375bd30Fd031E9F44EF6eCCC6aB23bb32B09a",
  ReventaMarketplace: "0x0423B4398a5d3Cc2CAfeb38Ada5039813afaaC75",
};
const CONTRATO_DE = Object.fromEntries(Object.entries(ADDR).map(([k, v]) => [v.toLowerCase(), k]));
// Mnemónico público de Hardhat (cuentas de prueba, sin valor real).
const MNEMONIC = "test test test test test test test test test test test junk";
const VENTANA_QR = 60, MARGEN_CIERRE = 86400;
const TIPOS = ["Recital", "Espectaculo", "Futbol"];
const TIPO_LABEL = { Recital: "Recital", Espectaculo: "Espectáculo", Futbol: "Fútbol" };
const TIPO_COLOR = { Recital: ["#D9481F", "#7A1E52"], Espectaculo: ["#4136B8", "#1F7A8C"], Futbol: ["#1B7F4C", "#0E3B5C"] };
// Lista de derecho de admisión que consulta el verificador (Tribuna Segura) en eventos que lo requieren.
const RESTRINGIDOS = new Set(["30111222"]);

const PERFILES = [
  { key: "org", nombre: "Productora Mediterránea", rol: "Organizador", roles: ["ORGANIZADOR_ROLE"], color: "#DE4F24" },
  { key: "oraculo", nombre: "Oráculo de eventos", rol: "Oráculo", roles: ["ORACULO_ROLE"], color: "#7A4BC9" },
  { key: "verif", nombre: "Tribuna Segura (KYC)", rol: "Verificador", roles: ["VERIFICADOR_ROLE"], color: "#1F7A8C" },
  { key: "puerta", nombre: "Control de acceso · Puerta 3", rol: "Validador", roles: ["VALIDADOR_ROLE"], color: "#3A3A52" },
  { key: "artista", nombre: "Sierras Sónicas", rol: "Artista", roles: [], color: "#B5357A" },
  { key: "plataforma", nombre: "e-TicketEvento S.A.", rol: "Plataforma", roles: [], color: "#4A44C6" },
  { key: "ana", nombre: "Ana Ferreyra", rol: "Fan", roles: [], color: "#E08A12", dni: "38456123" },
  { key: "bruno", nombre: "Bruno Quiroga", rol: "Fan", roles: [], color: "#157F59", dni: "41222333" },
  { key: "carla", nombre: "Carla Mansilla", rol: "Fan", roles: [], color: "#C2303B", dni: "30111222" },
];
const W = {}; // key -> {perfil, wallet, address}
const BY_ADDR = {};

const ERR_MSG = {
  AccessControlUnauthorizedAccount: "La billetera no tiene el rol que exige la función.",
  EventoYaExiste: "Ya existe un evento con ese ID.",
  EventoInexistente: "El evento no existe.",
  FechaInvalida: "La fecha del evento tiene que ser futura.",
  CapacidadInvalida: "La capacidad tiene que ser mayor a cero.",
  PrecioInvalido: "El precio base tiene que ser mayor a cero.",
  DireccionInvalida: "Dirección de artista o plataforma inválida.",
  SumaPorcentajesInvalida: "Regalía + comisión tienen que sumar menos de 100 %.",
  LimitePorPersonaInvalido: "El límite por persona tiene que ser al menos 1.",
  EventoNoProgramado: "El evento no está en estado Programado.",
  CapacidadAgotada: "No quedan entradas: capacidad agotada.",
  MontoIncorrecto: "El monto enviado no coincide con el precio exacto.",
  LimitePorPersonaExcedido: "Esta identidad ya alcanzó el máximo de entradas por persona.",
  FirmaInvalida: "La firma no pertenece a quien corresponde.",
  ECDSAInvalidSignature: "La firma está mal formada.",
  FueraDeTermino: "La operación está fuera del plazo permitido.",
  YaReembolsada: "Esta entrada ya fue reembolsada.",
  EntradaNoValidaParaIngreso: "La entrada no está en un estado válido para esta operación.",
  NoEsTitular: "Solo el titular puede hacer esta operación.",
  SinSaldo: "No hay saldo pendiente para retirar.",
  TransferenciaDirectaBloqueada: "Candado antifraude: las transferencias P2P están bloqueadas. Solo se revende en el marketplace oficial.",
  CompromisoNoCoincide: "La identidad presentada no coincide con la del titular.",
  QRExpirado: "El QR venció (ventana de 60 s). Probablemente es una captura de pantalla.",
  TokenNoExiste: "La entrada no existe.",
  MaxTransferenciasAlcanzado: "La entrada alcanzó el máximo de reventas permitido.",
  PrecioSuperaTope: "El precio supera el tope legal de reventa.",
  PublicacionNoActiva: "La publicación ya no está activa.",
};

/* ------------------------------ utilidades ------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "—");
const shortH = (h) => (h ? h.slice(0, 10) + "…" + h.slice(-6) : "—");
const toWei = (s) => BigInt(U.parseEther(String(s)).toString());
const POL = (wei, d = 4) => {
  const n = Number(U.formatEther((wei ?? 0n).toString()));
  return n.toLocaleString("es-AR", { maximumFractionDigits: d }) + " POL";
};
const pct = (bps) => (bps / 100).toLocaleString("es-AR", { maximumFractionDigits: 2 }) + " %";
const fmtFecha = (ts) => new Date(ts * 1000).toLocaleString("es-AR", { weekday: "short", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const fmtHora = (ts) => new Date(ts * 1000).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtDia = (ts) => new Date(ts * 1000).toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
const selector = (sig) => U.id(sig).slice(0, 10);
const nombreDe = (addr) => { if (!addr) return "—"; const w = BY_ADDR[addr.toLowerCase()]; if (w) return w.perfil.nombre; const c = CONTRATO_DE[addr.toLowerCase()]; return c || short(addr); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const randHash = () => U.hexlify(U.randomBytes(32));
const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0]).join("").toUpperCase();
const avatar = (p, size) => `<span class="avatar" style="background:${p.color};${size ? `width:${size}px;height:${size}px` : ""}">${esc(initials(p.nombre))}</span>`;

/* ------------------------------ estado ------------------------------ */
let S;
function freshState() {
  const bal = {};
  for (const p of PERFILES) bal[W[p.key].address.toLowerCase()] = p.rol === "Fan" ? toWei("150") : toWei("5");
  return {
    offset: 0, block: 14820331,
    eventos: {}, entradas: {}, nextTokenId: 1, porPersona: {},
    saldos: {}, bal, pubs: {}, nextPub: 1, tokenAPub: {},
    txs: [], qrs: [], ident: {},
    selEvento: null, selToken: null,
    cur: "org", view: "organizador",
  };
}
const now = () => Math.floor(Date.now() / 1000) + S.offset;
const cur = () => W[S.cur];
const addrOf = (k) => W[k].address;
const lc = (a) => a.toLowerCase();
const ROLES = () => ({
  ORGANIZADOR_ROLE: [addrOf("org")], ORACULO_ROLE: [addrOf("oraculo")],
  VERIFICADOR_ROLE: [addrOf("verif")], VALIDADOR_ROLE: [addrOf("puerta")],
});
const hasRole = (addr, role) => !!addr && ROLES()[role].some((a) => lc(a) === lc(addr));

/* ------------------------------ EIP-712 ------------------------------ */
const DOM_EM = () => ({ name: "EventManager", version: "1", chainId: CHAIN_ID, verifyingContract: ADDR.EventManager });
const DOM_NFT = () => ({ name: "EntradaNFT", version: "1", chainId: CHAIN_ID, verifyingContract: ADDR.EntradaNFT });
const T_VERIF = { VerificarIdentidad: [{ name: "compromiso", type: "bytes32" }, { name: "comprador", type: "address" }, { name: "idEvento", type: "uint256" }] };
const T_ACCESO = { ValidarAcceso: [{ name: "tokenId", type: "uint256" }, { name: "timestamp", type: "uint64" }] };
// Tribuna Segura asigna un salt determinístico por DNI: la misma persona siempre produce el mismo compromiso,
// así el límite por persona se cumple aunque use varias billeteras.
const saltPara = (dni) => U.keccak256(U.defaultAbiCoder.encode(["string", "uint256"], ["tribuna-segura/salt/v1", dni]));
const compromisoDe = (dni, salt) => U.keccak256(U.defaultAbiCoder.encode(["uint256", "bytes32"], [dni, salt]));
const firmarVerificacion = (signer, compromiso, comprador, idEvento) => signer._signTypedData(DOM_EM(), T_VERIF, { compromiso, comprador, idEvento });
const firmarAcceso = (signer, tokenId, timestamp) => signer._signTypedData(DOM_NFT(), T_ACCESO, { tokenId, timestamp });
function recuperar(dom, types, value, firma, contrato) {
  try { return U.verifyTypedData(dom, types, value, firma); } catch { revert("ECDSAInvalidSignature", contrato); }
}

/* ------------------------------ contratos simulados ------------------------------ */
class Revert extends Error {
  constructor(name, contrato, sig) { super(name); this.errName = name; this.contrato = contrato; this.sig = sig || name + "()"; this.selector = selector(this.sig); }
}
function revert(name, contrato, sig) { throw new Revert(name, contrato, sig); }
function onlyRole(m, role, contrato) { if (!hasRole(m.from, role)) revert("AccessControlUnauthorizedAccount", contrato, "AccessControlUnauthorizedAccount(address,bytes32)"); }
const ev = (contrato, name, args) => ({ contrato, name, args });
const credit = (addr, monto) => { const k = lc(addr); S.saldos[k] = (S.saldos[k] || 0n) + monto; };
function marcarEntrada(t, estado, m) { t.estado = estado; t.historial.push({ estado, ts: now(), tx: m.hash }); }

const estadoEfectivo = (t) => {
  if (t.estado === "Utilizada" || t.estado === "Reembolsada") return t.estado;
  if (S.eventos[t.idEvento]?.estado === "Finalizado") return "Vencida";
  return t.estado === "EnReventa" ? "En reventa" : "Asignada";
};

const EventManager = {
  crearEvento(m, p) {
    onlyRole(m, "ORGANIZADOR_ROLE", "EventManager");
    if (S.eventos[p.idEvento]) revert("EventoYaExiste", "EventManager");
    if (p.fechaHora <= now()) revert("FechaInvalida", "EventManager");
    if (p.capacidad === 0) revert("CapacidadInvalida", "EventManager");
    if (p.precioBase === 0n) revert("PrecioInvalido", "EventManager");
    if (!U.isAddress(p.artista) || !U.isAddress(p.plataforma) || /^0x0{40}$/i.test(p.artista) || /^0x0{40}$/i.test(p.plataforma)) revert("DireccionInvalida", "EventManager");
    if (p.regaliaBps + p.comisionBps >= 10000) revert("SumaPorcentajesInvalida", "EventManager");
    if (p.limitePorPersona === 0) revert("LimitePorPersonaInvalido", "EventManager");
    S.eventos[p.idEvento] = { ...p, organizador: m.from, vendidas: 0, estado: "Programado", custodia: 0n, historial: [{ estado: "Programado", ts: now(), tx: m.hash }] };
    S.selEvento = p.idEvento;
    return [ev("EventManager", "EventoCreado", { idEvento: p.idEvento, nombre: p.nombre, organizador: m.from, precioBase: p.precioBase, capacidad: p.capacidad })];
  },
  comprarEntrada(m, idEvento, compromiso, firma) {
    const e = S.eventos[idEvento];
    if (!e) revert("EventoInexistente", "EventManager");
    if (e.estado !== "Programado") revert("EventoNoProgramado", "EventManager");
    if (now() >= e.fechaHora) revert("FueraDeTermino", "EventManager");
    if (e.vendidas >= e.capacidad) revert("CapacidadAgotada", "EventManager");
    if (m.value !== e.precioBase) revert("MontoIncorrecto", "EventManager");
    const firmante = recuperar(DOM_EM(), T_VERIF, { compromiso, comprador: m.from, idEvento }, firma, "EventManager");
    if (!hasRole(firmante, "VERIFICADOR_ROLE")) revert("FirmaInvalida", "EventManager");
    const k = idEvento + ":" + compromiso;
    if ((S.porPersona[k] || 0) >= e.limitePorPersona) revert("LimitePorPersonaExcedido", "EventManager");
    // efectos
    S.porPersona[k] = (S.porPersona[k] || 0) + 1;
    e.vendidas += 1; e.custodia += m.value;
    const tokenId = S.nextTokenId++;
    S.entradas[tokenId] = {
      tokenId, idEvento, precioOriginal: e.precioBase, compromiso, cantTransferencias: 0, estado: "Asignada",
      fechaEmision: now(), fechaValidacion: 0, owner: m.from, royalty: { receiver: e.artista, bps: e.regaliaBps },
      historial: [{ estado: "Asignada", ts: now(), tx: m.hash }],
    };
    S.selToken = tokenId; S.selEvento = idEvento;
    return { result: tokenId, events: [
      ev("EntradaNFT", "Transfer", { from: U.hexZeroPad("0x0", 20), to: m.from, tokenId }),
      ev("EntradaNFT", "EntradaEmitida", { idEvento, tokenId, titular: m.from, compromiso }),
      ev("EventManager", "EntradaComprada", { idEvento, tokenId, comprador: m.from, compromiso }),
    ] };
  },
  cancelarEvento(m, idEvento) {
    onlyRole(m, "ORACULO_ROLE", "EventManager");
    const e = S.eventos[idEvento];
    if (!e) revert("EventoInexistente", "EventManager");
    if (e.estado !== "Programado") revert("EventoNoProgramado", "EventManager");
    if (now() >= e.fechaHora) revert("FueraDeTermino", "EventManager");
    e.estado = "Cancelado"; e.historial.push({ estado: "Cancelado", ts: now(), tx: m.hash });
    S.selEvento = idEvento;
    return [ev("EventManager", "EventoCancelado", { idEvento })];
  },
  cerrarEvento(m, idEvento) {
    onlyRole(m, "ORACULO_ROLE", "EventManager");
    const e = S.eventos[idEvento];
    if (!e) revert("EventoInexistente", "EventManager");
    if (e.estado !== "Programado") revert("EventoNoProgramado", "EventManager");
    if (now() < e.fechaHora + MARGEN_CIERRE) revert("FueraDeTermino", "EventManager");
    e.estado = "Finalizado"; e.historial.push({ estado: "Finalizado", ts: now(), tx: m.hash });
    const lib = e.custodia; e.custodia = 0n; credit(e.organizador, lib);
    S.selEvento = idEvento;
    return [ev("EventManager", "EventoCerrado", { idEvento, organizador: e.organizador, balanceLiberado: lib }), ev("EventManager", "SaldoAcreditado", { beneficiario: e.organizador, monto: lib })];
  },
  reclamarReembolso(m, tokenId) {
    const t = S.entradas[tokenId];
    if (!t) revert("TokenNoExiste", "EntradaNFT");
    const e = S.eventos[t.idEvento];
    if (e.estado !== "Cancelado") revert("EventoNoProgramado", "EventManager");
    if (t.estado === "Reembolsada") revert("YaReembolsada", "EventManager");
    if (t.estado === "Utilizada") revert("EntradaNoValidaParaIngreso", "EventManager");
    const evs = [];
    if (t.estado === "Asignada") {
      if (lc(m.from) !== lc(t.owner)) revert("NoEsTitular", "EventManager");
    } else {
      const vendedor = Marketplace.obtenerVendedorDeToken(tokenId);
      if (!vendedor || lc(m.from) !== lc(vendedor)) revert("NoEsTitular", "EventManager");
      evs.push(...Marketplace._cerrarPorReembolso(m, tokenId));
    }
    marcarEntrada(t, "Reembolsada", m);
    e.custodia -= t.precioOriginal; credit(m.from, t.precioOriginal);
    S.selToken = tokenId;
    return [...evs, ev("EntradaNFT", "EstadoEntradaCambiado", { tokenId, nuevoEstado: "Reembolsada" }), ev("EventManager", "ReembolsoReclamado", { tokenId, titular: m.from, monto: t.precioOriginal }), ev("EventManager", "SaldoAcreditado", { beneficiario: m.from, monto: t.precioOriginal })];
  },
  retirarFondos(m) {
    const k = lc(m.from); const monto = S.saldos[k] || 0n;
    if (monto === 0n) revert("SinSaldo", "EventManager");
    S.saldos[k] = 0n; S.bal[k] = (S.bal[k] || 0n) + monto;
    return [ev("EventManager", "FondosRetirados", { beneficiario: m.from, monto })];
  },
};

const EntradaNFT = {
  transferFrom(m, from, to, tokenId) {
    // Hook _update: transferencia entre billeteras sin OPERADOR_ROLE -> bloqueada.
    revert("TransferenciaDirectaBloqueada", "EntradaNFT");
  },
  approve(m, to, tokenId) { revert("TransferenciaDirectaBloqueada", "EntradaNFT"); },
  validarIngreso(m, tokenId, compromisoPresentado, timestamp, firma) {
    onlyRole(m, "VALIDADOR_ROLE", "EntradaNFT");
    const t = S.entradas[tokenId];
    if (!t) revert("TokenNoExiste", "EntradaNFT");
    if (t.estado !== "Asignada") revert("EntradaNoValidaParaIngreso", "EntradaNFT");
    if (S.eventos[t.idEvento].estado !== "Programado") revert("EventoNoProgramado", "EntradaNFT");
    if (t.compromiso !== compromisoPresentado) revert("CompromisoNoCoincide", "EntradaNFT");
    if (now() > timestamp + VENTANA_QR || timestamp > now() + 5) revert("QRExpirado", "EntradaNFT");
    const firmante = recuperar(DOM_NFT(), T_ACCESO, { tokenId, timestamp }, firma, "EntradaNFT");
    if (lc(firmante) !== lc(t.owner)) revert("FirmaInvalida", "EntradaNFT");
    marcarEntrada(t, "Utilizada", m); t.fechaValidacion = now();
    S.selToken = tokenId; S.selEvento = t.idEvento;
    return [ev("EntradaNFT", "IngresoValidado", { tokenId, titular: t.owner, timestamp: now() }), ev("EntradaNFT", "EstadoEntradaCambiado", { tokenId, nuevoEstado: "Utilizada" })];
  },
};

const Marketplace = {
  obtenerVendedorDeToken(tokenId) { const id = S.tokenAPub[tokenId]; return id ? S.pubs[id].vendedor : null; },
  precioMax(t) { const e = S.eventos[t.idEvento]; return (t.precioOriginal * BigInt(10000 + e.topeBps)) / 10000n; },
  publicarReventa(m, tokenId, precio) {
    const t = S.entradas[tokenId];
    if (!t) revert("ERC721NonexistentToken", "EntradaNFT", "ERC721NonexistentToken(uint256)");
    if (lc(t.owner) !== lc(m.from)) revert("NoEsTitular", "ReventaMarketplace");
    if (t.estado !== "Asignada") revert("EntradaNoValidaParaIngreso", "ReventaMarketplace");
    const e = S.eventos[t.idEvento];
    if (e.estado !== "Programado") revert("EventoNoProgramado", "ReventaMarketplace");
    if (now() >= e.fechaHora) revert("FueraDeTermino", "ReventaMarketplace");
    if (t.cantTransferencias >= e.maxTransferencias) revert("MaxTransferenciasAlcanzado", "ReventaMarketplace");
    if (precio > this.precioMax(t)) revert("PrecioSuperaTope", "ReventaMarketplace");
    t.owner = ADDR.ReventaMarketplace; marcarEntrada(t, "EnReventa", m);
    const id = S.nextPub++;
    S.pubs[id] = { id, tokenId, vendedor: m.from, precio, fecha: now(), estado: "Activa" };
    S.tokenAPub[tokenId] = id; S.selToken = tokenId;
    return { result: id, events: [
      ev("EntradaNFT", "Transfer", { from: m.from, to: ADDR.ReventaMarketplace, tokenId }),
      ev("EntradaNFT", "EstadoEntradaCambiado", { tokenId, nuevoEstado: "EnReventa" }),
      ev("ReventaMarketplace", "ReventaPublicada", { idPublicacion: id, idToken: tokenId, vendedor: m.from, precioReventa: precio }),
    ] };
  },
  retirarPublicacion(m, idPub) {
    const p = S.pubs[idPub];
    if (!p || p.estado !== "Activa") revert("PublicacionNoActiva", "ReventaMarketplace");
    if (lc(m.from) !== lc(p.vendedor)) revert("NoEsTitular", "ReventaMarketplace");
    p.estado = "Retirada"; delete S.tokenAPub[p.tokenId];
    const t = S.entradas[p.tokenId]; marcarEntrada(t, "Asignada", m); t.owner = p.vendedor; S.selToken = t.tokenId;
    return [ev("EntradaNFT", "EstadoEntradaCambiado", { tokenId: p.tokenId, nuevoEstado: "Asignada" }), ev("EntradaNFT", "Transfer", { from: ADDR.ReventaMarketplace, to: p.vendedor, tokenId: p.tokenId }), ev("ReventaMarketplace", "PublicacionRetirada", { idPublicacion: idPub, idToken: p.tokenId })];
  },
  split(p) {
    const t = S.entradas[p.tokenId], e = S.eventos[t.idEvento];
    const regalia = (p.precio * BigInt(t.royalty.bps)) / 10000n;
    const comision = (p.precio * BigInt(e.comisionBps)) / 10000n;
    return { regalia, comision, neto: p.precio - regalia - comision, artista: t.royalty.receiver, plataforma: e.plataforma };
  },
  revenderEntrada(m, idPub, nuevoCompromiso, firma) {
    const p = S.pubs[idPub];
    if (!p || p.estado !== "Activa") revert("PublicacionNoActiva", "ReventaMarketplace");
    if (m.value !== p.precio) revert("MontoIncorrecto", "ReventaMarketplace");
    const t = S.entradas[p.tokenId], e = S.eventos[t.idEvento];
    if (e.estado !== "Programado") revert("EventoNoProgramado", "ReventaMarketplace");
    if (now() >= e.fechaHora) revert("FueraDeTermino", "ReventaMarketplace");
    // EventManager.registrarTransferenciaIdentidad
    const firmante = recuperar(DOM_EM(), T_VERIF, { compromiso: nuevoCompromiso, comprador: m.from, idEvento: t.idEvento }, firma, "EventManager");
    if (!hasRole(firmante, "VERIFICADOR_ROLE")) revert("FirmaInvalida", "EventManager");
    const kc = t.idEvento + ":" + nuevoCompromiso, kv = t.idEvento + ":" + t.compromiso;
    if ((S.porPersona[kc] || 0) >= e.limitePorPersona) revert("LimitePorPersonaExcedido", "EventManager");
    // efectos
    if ((S.porPersona[kv] || 0) > 0) S.porPersona[kv] -= 1;
    S.porPersona[kc] = (S.porPersona[kc] || 0) + 1;
    const sp = this.split(p);
    const evs = [];
    if (sp.regalia > 0n) { credit(sp.artista, sp.regalia); evs.push(ev("EventManager", "SaldoAcreditado", { beneficiario: sp.artista, monto: sp.regalia })); }
    if (sp.comision > 0n) { credit(sp.plataforma, sp.comision); evs.push(ev("EventManager", "SaldoAcreditado", { beneficiario: sp.plataforma, monto: sp.comision })); }
    if (sp.neto > 0n) { credit(p.vendedor, sp.neto); evs.push(ev("EventManager", "SaldoAcreditado", { beneficiario: p.vendedor, monto: sp.neto })); }
    p.estado = "Vendida"; p.comprador = m.from; delete S.tokenAPub[p.tokenId];
    t.compromiso = nuevoCompromiso; t.cantTransferencias += 1;
    marcarEntrada(t, "Asignada", m); t.owner = m.from; S.selToken = t.tokenId;
    return [...evs,
      ev("EntradaNFT", "CompromisoActualizado", { tokenId: t.tokenId, nuevoCompromiso, cantTransferencias: t.cantTransferencias }),
      ev("EntradaNFT", "EstadoEntradaCambiado", { tokenId: t.tokenId, nuevoEstado: "Asignada" }),
      ev("EntradaNFT", "Transfer", { from: ADDR.ReventaMarketplace, to: m.from, tokenId: t.tokenId }),
      ev("ReventaMarketplace", "EntradaRevendida", { idPublicacion: idPub, idToken: t.tokenId, vendedor: p.vendedor, comprador: m.from, precio: p.precio })];
  },
  _cerrarPorReembolso(m, tokenId) {
    const id = S.tokenAPub[tokenId]; if (!id) return [];
    S.pubs[id].estado = "Retirada"; delete S.tokenAPub[tokenId];
    S.entradas[tokenId].owner = S.pubs[id].vendedor;
    return [ev("EntradaNFT", "Transfer", { from: ADDR.ReventaMarketplace, to: S.pubs[id].vendedor, tokenId })];
  },
};

const GAS = { crearEvento: 268000, comprarEntrada: 236000, cancelarEvento: 31000, cerrarEvento: 58000, reclamarReembolso: 79000, retirarFondos: 34000, transferFrom: 27000, approve: 25000, validarIngreso: 71000, publicarReventa: 121000, retirarPublicacion: 64000, revenderEntrada: 214000 };

/* ------------------------------ ejecución de transacciones ------------------------------ */
// Ejecuta una tx simulada. Si el contrato revierte, el estado queda intacto (las validaciones van antes de los efectos).
function ejecutar({ fromKey, contrato, fn, args = [], value = 0n, run, silent }) {
  const from = addrOf(fromKey);
  const hash = randHash();
  S.block += 1 + Math.floor(Math.random() * 3);
  const m = { from, value, hash };
  const tx = { hash, block: S.block, ts: now(), fromKey, contrato, fn, args, value, status: "ok", events: [], gas: Math.round((GAS[fn] || 50000) * (0.94 + Math.random() * 0.1)) };
  const k = lc(from);
  if ((S.bal[k] || 0n) < value) {
    return { ok: false, wallet: true, msg: `Saldo insuficiente en la billetera: tenés ${POL(S.bal[k])} y la operación necesita ${POL(value)}.` };
  }
  try {
    const r = run(m);
    tx.events = Array.isArray(r) ? r : r.events; tx.result = Array.isArray(r) ? undefined : r.result;
    S.bal[k] -= value;
  } catch (err) {
    if (!(err instanceof Revert)) throw err;
    tx.status = "revert"; tx.error = err; tx.gas = Math.round(tx.gas * 0.32);
  }
  S.txs.unshift(tx);
  if (!silent) S.lastTx = hash;
  return { ok: tx.status === "ok", tx };
}

function logFirma(fromKey, tipo, detalle, firma) {
  S.txs.unshift({ kind: "firma", hash: firma, ts: now(), fromKey, tipo, detalle });
  S.lastTx = firma;
}

// Flujo completo con confirmación en la billetera y "minado".
async function enviarTx(opts) {
  const confirmado = S.autoConfirm ? true : await walletConfirm(opts);
  if (!confirmado) { toast("Rechazaste la transacción en la billetera.", ""); return { ok: false, rejected: true }; }
  showPending(opts);
  await wait(650 + Math.random() * 500);
  closeWallet();
  const r = ejecutar(opts);
  if (r.wallet) { toast(r.msg, "bad"); render(); return r; }
  if (r.ok) toast(`✓ ${opts.fn} confirmada en el bloque ${r.tx.block.toLocaleString("es-AR")}`, "ok");
  else toast(`✗ ${opts.fn} revertida: ${r.tx.error.errName}`, "bad");
  render();
  return r;
}

let formDraft = null;
function defaultDraft() {
  const ids = Object.keys(S.eventos).map(Number);
  const d = new Date((now() + 21 * 86400) * 1000); d.setHours(21, 0, 0, 0);
  const pad = (n) => String(n).padStart(2, "0");

    f_fecha: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,
    f_lugar: "Estadio Mario A. Kempes, Córdoba", f_artista: "artista", f_artistaCustom: "", f_plataforma: "plataforma",
    f_precio: "18", f_capacidad: "5000", f_tope: "20", f_regalia: "5", f_comision: "3", f_limite: "4", f_maxTr: "2", f_admision: false,
  };

function leerDraft() {
  const d = {};
  for (const el of document.querySelectorAll("#fEvento [id^=f_]")) d[el.id] = el.type === "checkbox" ? el.checked : el.value;
  return d;
}
function parseDraft(d) {
  const errs = {}, fmt = {};
  let contrato = null;
  const num = (v) => (String(v).trim() === "" ? NaN : Number(v));
  const id = num(d.f_id);
  if (!Number.isInteger(id) || id < 1) fmt.f_id = "Ingresá un número entero ≥ 1.";
  else if (S.eventos[id]) { errs.f_id = "Ya existe un evento con ese ID."; contrato = contrato || "EventoYaExiste"; }
  if (!d.f_nombre.trim()) fmt.f_nombre = "El nombre es obligatorio.";
  else if (d.f_nombre.length > 80) fmt.f_nombre = "Máximo 80 caracteres.";
  if (!d.f_lugar.trim()) fmt.f_lugar = "Indicá el lugar.";
  const fecha = d.f_fecha ? Math.floor(new Date(d.f_fecha).getTime() / 1000) : NaN;
  if (!Number.isFinite(fecha)) fmt.f_fecha = "Elegí fecha y hora.";
  else if (fecha <= now()) { errs.f_fecha = "La fecha ya pasó según el reloj de la cadena."; contrato = contrato || "FechaInvalida"; }
  const cap = num(d.f_capacidad);
  if (!Number.isInteger(cap) || cap < 0 || cap > 4294967295) fmt.f_capacidad = "Entero entre 0 y 4.294.967.295.";
  else if (cap === 0) { errs.f_capacidad = "La capacidad tiene que ser mayor a 0."; contrato = contrato || "CapacidadInvalida"; }
  let precio = null;
  if (!/^\d+(\.\d{1,18})?$/.test(d.f_precio.trim())) fmt.f_precio = "Usá un número con punto decimal (ej. 18.5).";
  else { precio = toWei(d.f_precio.trim()); if (precio === 0n) { errs.f_precio = "El precio tiene que ser mayor a 0."; contrato = contrato || "PrecioInvalido"; } }
  let artista = d.f_artista === "otra" ? d.f_artistaCustom.trim() : d.f_artista ? addrOf(d.f_artista) : "";
  if (d.f_artista === "otra" && !U.isAddress(artista)) { errs.f_artista = "Dirección inválida (0x + 40 hex)."; contrato = contrato || "DireccionInvalida"; }
  if (d.f_artista === "otra" && U.isAddress(artista) && /^0x0{40}$/i.test(artista)) { errs.f_artista = "No puede ser la dirección cero."; contrato = contrato || "DireccionInvalida"; }
  const plataforma = addrOf(d.f_plataforma);
  const bps = (v, key, max) => { const n = num(v); if (!Number.isFinite(n) || n < 0 || n > max) { fmt[key] = `Entre 0 y ${max} %.`; return null; } return Math.round(n * 100); };
  const topeBps = bps(d.f_tope, "f_tope", 655), regaliaBps = bps(d.f_regalia, "f_regalia", 100), comisionBps = bps(d.f_comision, "f_comision", 100);
  if (regaliaBps != null && comisionBps != null && regaliaBps + comisionBps >= 10000) { errs.f_comision = "Regalía + comisión deben sumar menos de 100 %."; contrato = contrato || "SumaPorcentajesInvalida"; }
  const lim = num(d.f_limite), maxTr = num(d.f_maxTr);
  if (!Number.isInteger(lim) || lim < 0 || lim > 255) fmt.f_limite = "Entero entre 0 y 255.";
  else if (lim === 0) { errs.f_limite = "Tiene que ser al menos 1."; contrato = contrato || "LimitePorPersonaInvalido"; }
  if (!Number.isInteger(maxTr) || maxTr < 0 || maxTr > 255) fmt.f_maxTr = "Entero entre 0 y 255.";
  // El contrato revierte con el primer require que falla: primero AccessControl, después el orden de los if.
  const ordenContrato = ["EventoYaExiste", "FechaInvalida", "CapacidadInvalida", "PrecioInvalido", "DireccionInvalida", "SumaPorcentajesInvalida", "LimitePorPersonaInvalido"];
  contrato = ordenContrato.find((n) => Object.keys(errs).some((k) => mapErr[k] === n)) || null;
  if (!hasRole(cur().address, "ORGANIZADOR_ROLE")) contrato = "AccessControlUnauthorizedAccount";
  return {
    fmt, errs, contrato,
    p: { idEvento: id, nombre: d.f_nombre.trim(), tipo: d.f_tipo, fechaHora: fecha, lugar: d.f_lugar.trim(), artista, plataforma, precioBase: precio, capacidad: cap, topeBps, regaliaBps, comisionBps, limitePorPersona: lim, maxTransferencias: maxTr, requiereAdmision: !!d.f_admision },

async function ckVerificar() {
  const e = ckEvento(), idc = ckIdent();
  CK.busy = true; CK.rechazo = null; renderCheckout();
  await wait(500);
  if (!CK.ataque.firmaPropia && e.requiereAdmision && RESTRINGIDOS.has(CK.dni.trim())) {
    CK.busy = false; CK.rechazo = "El DNI tiene una restricción de concurrencia vigente en el registro de derecho de admisión (Ley 23.184). No se emite la firma, así que la compra no puede seguir.";
    toast("Tribuna Segura rechazó la verificación", "bad"); renderCheckout(); return;
  }
  const signerKey = CK.ataque.firmaPropia ? CK.buyer : "verif";
  const firma = await firmarVerificacion(W[signerKey].wallet, idc.compromiso, addrOf(CK.buyer), e.idEvento);
  CK.firma = firma; CK.firmante = U.verifyTypedData(DOM_EM(), T_VERIF, { compromiso: idc.compromiso, comprador: addrOf(CK.buyer), idEvento: e.idEvento }, firma);
  CK.busy = false;
  logFirma(signerKey, "VerificarIdentidad", `comprador ${short(addrOf(CK.buyer))} · evento #${e.idEvento}`, firma);
  renderCheckout(); render();
}
async function ckPagar() {
  const e = ckEvento(), idc = ckIdent(), precio = ckPrecio();
  const value = CK.ataque.monto ? (precio * 9n) / 10n : precio;
  let r;
  if (CK.mode === "primaria") {
    r = await enviarTx({ fromKey: CK.buyer, contrato: "EventManager", fn: "comprarEntrada", value,
      args: [["idEvento", e.idEvento], ["compromiso", shortH(idc.compromiso)], ["firmaVerificador", shortH(CK.firma)]],
      run: (m) => EventManager.comprarEntrada(m, e.idEvento, idc.compromiso, CK.firma) });
  } else {
    r = await enviarTx({ fromKey: CK.buyer, contrato: "ReventaMarketplace", fn: "revenderEntrada", value,
      args: [["idPublicacion", CK.id], ["nuevoCompromiso", shortH(idc.compromiso)], ["firmaVerificador", shortH(CK.firma)]],
      run: (m) => Marketplace.revenderEntrada(m, CK.id, idc.compromiso, CK.firma) });
  }
  if (!r || r.rejected || r.wallet || !CK) return;
  if (r.ok) S.ident[CK.buyer] = { nombre: CK.nombre.trim(), dni: CK.dni.trim(), salt: idc.salt, compromiso: idc.compromiso };
  CK.resultado = r; CK.step = 4; renderCheckout();
}

let QRS = null, qrTimer = null;
async function abrirQR(tokenId) {

async function renovarQR() {
  const t = S.entradas[QRS.tokenId];
  const ts = now();
  const firma = await firmarAcceso(W[QRS.owner].wallet, t.tokenId, ts);
  QRS.payload = { tokenId: t.tokenId, timestamp: ts, compromiso: t.compromiso, firma };
  S.qrs.unshift({ ...QRS.payload, de: QRS.owner, generado: ts });
  S.qrs = S.qrs.slice(0, 12);
  logFirma(QRS.owner, "ValidarAcceso", `QR entrada #${t.tokenId} · ts ${ts}`, firma);
  pintarQR(); renderSide();
}
function pintarQR() {
  const t = S.entradas[QRS.tokenId], e = S.eventos[t.idEvento];
  const str = JSON.stringify(QRS.payload);
  const q = qrcode(0, "M"); q.addData(str); q.make();
  const restante = QRS.payload.timestamp + VENTANA_QR - now();
  $("#modalRoot").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="QR de ingreso"><div class="modal wide">
    <div class="modal-head"><div><span class="chip">QR dinámico · EIP-712</span><h2 style="margin-top:4px">Entrada #${t.tokenId} · ${esc(e.nombre)}</h2></div><button class="btn ghost small x" type="button" data-qr-close>Cerrar</button></div>
    <div class="modal-body"><div class="qr-wrap">
      <div class="qr ${restante <= 0 ? "expired" : ""}" id="qrBox">${q.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>
      <div class="list" style="gap:10px;min-width:0">
        <div><span class="muted" style="font-size:12px">Válido por</span><div class="ring" id="qrCount">${Math.max(0, restante)} s</div><div class="bar" style="margin-top:6px"><i id="qrBar" style="width:${Math.max(0, restante) / VENTANA_QR * 100}%"></i></div></div>
        <p class="muted" style="font-size:12.5px">Se renueva solo cada 30 s. Cada versión está firmada por tu billetera con la hora del bloque; el molinete rechaza cualquier QR de más de 60 s.</p>
        <div class="kvrows" style="font-size:11.5px"><div><span>timestamp</span><b class="mono">${QRS.payload.timestamp}</b></div><div><span>firma</span><b class="mono">${shortH(QRS.payload.firma)}</b></div></div>
        <div class="row"><button class="btn small" type="button" id="qrRenew">Renovar ahora</button><button class="btn small dark" type="button" data-go-door>Ir a la puerta</button></div>
      </div>
    </div></div>
  </div></div>`;
}
function tickQR() {
  if (!QRS || !$("#qrCount")) { clearInterval(qrTimer); qrTimer = null; return; }
  const edad = now() - QRS.payload.timestamp;
  if (edad >= 30 && edad < VENTANA_QR + 600 && S.entradas[QRS.tokenId].estado === "Asignada" && !QRS.renovando) {
    QRS.renovando = true; renovarQR().finally(() => { if (QRS) QRS.renovando = false; }); return;
  }
  const restante = Math.max(0, QRS.payload.timestamp + VENTANA_QR - now());
  $("#qrCount").textContent = restante + " s";
  $("#qrBar").style.width = (restante / VENTANA_QR) * 100 + "%";
  $("#qrBox").classList.toggle("expired", restante <= 0);
}
function cerrarQR() { QRS = null; if (qrTimer) clearInterval(qrTimer); qrTimer = null; $("#modalRoot").innerHTML = ""; }

function checksIngreso(p) {
  const t = S.entradas[p.tokenId];

  if (!add("Billetera con VALIDADOR_ROLE", hasRole(cur().address, "VALIDADOR_ROLE"))) return out;
  if (!add("La entrada existe", !!t)) return out;
  if (!add("Estado de la entrada: Asignada", t.estado === "Asignada")) return out;
  if (!add("Evento en estado Programado", S.eventos[t.idEvento].estado === "Programado")) return out;
  if (!add("Compromiso de identidad coincide", t.compromiso === p.compromiso)) return out;
  if (!add("QR dentro de la ventana de 60 s", !(now() > p.timestamp + VENTANA_QR || p.timestamp > now() + 5))) return out;
  let firmante = null; try { firmante = U.verifyTypedData(DOM_NFT(), T_ACCESO, { tokenId: p.tokenId, timestamp: p.timestamp }, p.firma); } catch {}

}
